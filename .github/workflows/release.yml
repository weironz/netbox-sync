name: Release Linux amd64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, matching Cargo.toml (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check release ref and version
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$TAG" = "v$version"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
      - name: Rust checks
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and check the exact image and binary
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          docker build --platform linux/amd64 --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --tag "$image" .
          test "$(docker run --rm --network none --read-only --cap-drop ALL "$image" --version)" = "netbox-sync ${TAG#v}"
          mkdir -p dist
          cid=$(docker create "$image")
          trap 'docker rm -v "$cid" >/dev/null' EXIT
          docker cp "$cid:/netbox-sync" dist/netbox-sync
          chmod 755 dist/netbox-sync
          test "$(dist/netbox-sync --version)" = "netbox-sync ${TAG#v}"
          tar -czf "dist/netbox-sync-$TAG-linux-amd64.tar.gz" -C dist netbox-sync
          docker save "$image" | gzip -n > "dist/netbox-sync-image-$TAG-linux-amd64.tar.gz"
      - name: Publish GitHub release assets
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          docker image inspect "$image" --format '{{.Id}}' > dist/image-id.txt
          grep -Eq '^sha256:[a-f0-9]{64}$' dist/image-id.txt
          (cd dist && sha256sum ./*.tar.gz image-id.txt > SHA256SUMS)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "netbox-sync $TAG" \
            --notes "Read-only NetBox snapshots and monitoring plans. Linux amd64 binary and Docker archive built from $GITHUB_SHA. Load the Docker archive with docker load -i; the local image tag is $image." \
            dist/*.tar.gz dist/image-id.txt dist/SHA256SUMS
      - name: Publish registry image if permitted
        continue-on-error: true
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! docker push "$image"; then
            echo '::warning::GHCR did not accept the image. The Docker archive is available in the GitHub Release.'
            exit 1
          fi

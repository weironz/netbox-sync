[package]
name = "netbox-sync"
version = "0.2.0"
edition = "2024"
description = "Read-only NetBox inventory snapshots and monitoring configuration plans"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
